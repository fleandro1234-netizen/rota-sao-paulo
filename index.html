*/
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,

/* Prevents IE11 from highlighting tiles in blue */

/* Safari renders non-retina tile on retina better with this, but Chrome is worse */

}

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;

	}
.leaflet-zoom-animated {

svg.leaflet-zoom-animated {

}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);

	}
.leaflet-bar a {
	background-color: #fff;

.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}
.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {

.leaflet-touch .leaflet-bar a {

/* attribution and scale controls */

.leaflet-popup {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,

.leaflet-tooltip-right:before {

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;

	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;

.leaflet-tooltip-right {

.leaflet-tooltip-left:before,

		-webkit-print-color-adjust: exact;

/*
  Rota São Paulo: plano de design (versão 6, 26/10/2026)
  Ideia: a estrada vista de cima, à noite. O mapa é asfalto nos dois temas; as rotas são tinta de faixa: amarela
  onde há muitas curvas (a faixa dupla que proíbe ultrapassar), branca nas moderadas, azul nas de poucas curvas.
  Os atrativos usam o marrom das placas de turismo; o alto do app é a placa verde de indicação.
  Marca: a faixa dupla amarela de curva e o emblema de selo continuam os mesmos da versão 5.
  Tipo: Overpass, desenhada a partir da letra das placas de rodovia, em títulos e texto; Overpass Mono nos números
  (km, curvas, odômetro, telefones), como marco quilométrico.
  Estrutura: nada de cartão flutuante. Controles chapados, raio 2 / 4 / 6, fio no lugar de sombra.
  Computador: app de mapa em tela cheia (faixa verde, coluna de 400 px, mapa); sem moldura de celular.
*/
:root {
  --bg: #EDF0F1;
  --surface: #FFFFFF;
  --surface-2: #EFF2F3;
  --surface-3: #CDD4D9;
  --ink: #0F171D;
  --ink-2: #424E57;
  --ink-3: #5C6872;
  --line: #DAE0E3;
  --marca-verde: #154734;
  --marca-asfalto: #101820;
  --marca-ambar: #CC8A00;
  --logo-borda: transparent;
  --estrela: #B57A00;
  --estrela-off: #D5DCE1;
  --mata: #154734;
  --mata-ink: #FFFFFF;
  --mata-soft: #DCEBE3;
  --ipe: #CC8A00;
  --ipe-soft: #F6EAD0;
  --ipe-ink: #101820;
  --sol: #CC8A00;
  --sol-soft: #F6EAD0;
  --alerta: #C8102E;
  --alerta-ink: #FFFFFF;
  --alerta-soft: #FBE7EA;
  --ok: #1E7A4E;
  --placa: #154734;
  --marrom: #6E3F22;
  --cp-cover: #154734;
  --cp-gold: #E7B75F;
  --painel: #101820;
  --painel-ink: #F4F6F7;
  --painel-ink-2: #AEBBC4;
  --painel-line: rgba(255, 255, 255, .14);
  --drum: #070B0F;
  --drum-ink: #F4F6F7;
  --drum-dec: #CC8A00;
  --drum-dec-ink: #101820;
  --drum-shade: rgba(0, 0, 0, .45);
  /* tinta das rotas sobre o asfalto do mapa */
  --curv-hi: #FFC20E;
  --curv-mid: #F1F0E8;
  --curv-lo: #6AA6DA;
  /* as mesmas três classes sobre papel (listas, perfil, carimbos): a faixa branca vira grafite e a amarela escurece */
  --curv-hi-ui: #A87400;
  --curv-mid-ui: #56626B;
  --curv-lo-ui: #2364AA;
  --route-shadow: rgba(0, 0, 0, .55);
  --sea: #0C171F;
  --land: #242D34;
  --land-2: #192026;
  --mun: #303A42;
  --road: #38434B;
  --road-major: #56616A;
  --urban: #323C44;
  --water: #2D5B7A;
  --sp-edge: #A3AEB5;
  --label: #B9C3C9;
  --label-city: #EEF2F4;
  --map-ink: #FFFFFF;
  --casing: #0A1015;
  --pin-edge: #FFFFFF;
  --bezel: #101820;
  /* pontos do mapa no marrom das placas de atrativo turístico; o pictograma diz a categoria; só o monumento tem cor própria */
  --c-pin: var(--marrom);
  --c-monumento: #E0A526;
  --c-comunidade: #5B6E7C;
  --float: 0 0 0 1px rgba(15, 23, 29, .3);
  --c-mirante: var(--c-pin);
  --c-natureza: var(--c-pin);
  --c-museu: var(--c-pin);
  --c-historia: var(--c-pin);
  --c-evento: var(--c-pin);
  --c-gastronomia: var(--c-pin);
  --c-apoio: var(--c-pin);
  --font: "Overpass", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-display: "Overpass", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-num: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-1: 2px;
  --r-2: 4px;
  --r-3: 6px;
  --gutL: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  --nav-h: 70px;
  --sheet-h: 232px;
  --hdr-h: 64px;
  --panel-w: 400px;
  --panel-top: 137px;
}

  --bg: #0B1116; --surface: #121A21; --surface-2: #19232B; --surface-3: #2A3640;
  --ink: #E8EDF0; --ink-2: #A9B6BF; --ink-3: #8794A0; --line: #222D36;

  --sol: #E0A526; --sol-soft: #352A10;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, summary, label, select { touch-action: manipulation; }
a { color: var(--mata); }
:focus-visible { outline: 3px solid var(--ipe); outline-offset: 2px; border-radius: var(--r-1); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
svg.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- stage ---------- */
/* ---------- palco: o app ocupa a tela inteira; no computador ele se reorganiza em coluna e mapa (fim da folha de estilo) ---------- */
.pitch { display: none; }
html, body { height: 100%; }
body { background: var(--surface); }
.stage, .device, .app { height: 100%; }

/* ---------- app shell ---------- */
.app { position: relative; overflow: hidden; isolation: isolate; background: var(--surface); color: var(--ink); }
#map { position: absolute; inset: 0; background: var(--sea); z-index: 0; }

.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 500; padding: 12px var(--gutR) 0 var(--gutL); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.brand-btn { width: 48px; height: 48px; flex: none; border: 0; border-radius: var(--r-2); padding: 0; background: var(--surface); box-shadow: var(--float); display: grid; place-items: center; }
.brand-btn svg { width: 38px; height: 38px; }
.search { flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface); border-radius: var(--r-2); box-shadow: var(--float); color: var(--ink-3); }
.search:focus-within { box-shadow: 0 0 0 3px var(--ipe), var(--float); }
.search input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.sos-btn { height: 48px; flex: none; border: 0; border-radius: var(--r-2); padding: 0 14px 0 11px; gap: 6px; display: inline-flex; align-items: center; background: var(--alerta); color: var(--alerta-ink); font-weight: 800; font-size: 16px; box-shadow: var(--float); }
.sos-btn svg.ic { width: 19px; height: 19px; stroke-width: 2.2; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); padding: 2px var(--gutR) 8px var(--gutL); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 6px; border-radius: var(--r-2); border: 0; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 700; white-space: nowrap; box-shadow: var(--float); }
.chip .pict { width: 24px; height: 24px; border-radius: 5px; background: var(--c, var(--ink-3)); color: #fff; display: grid; place-items: center; }
.chip .pict svg.ic { width: 15px; height: 15px; stroke-width: 2.2; }
.pict.inv { color: var(--surface); }
.chip[aria-pressed="false"] { background: color-mix(in srgb, var(--surface) 72%, transparent); color: var(--ink-3); box-shadow: none; }
.chip[aria-pressed="false"] .pict { background: var(--surface-3); color: var(--ink-3); }

.search-results { position: absolute; left: var(--gutL); right: var(--gutR); top: 70px; z-index: 520; background: var(--surface); border-radius: var(--r-2); box-shadow: var(--float); max-height: 55%; overflow: auto; overscroll-behavior: contain; padding: 6px 0; }
.sr-item { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 16px; border: 0; background: none; text-align: left; }
.sr-item small { display: block; color: var(--ink-3); font-size: 13px; }
.sr-empty { padding: 14px 16px; color: var(--ink-3); }

.fabs { position: absolute; right: var(--gutR); bottom: calc(var(--sheet-h) + var(--nav-h) + 22px); z-index: 450; display: grid; gap: 8px; transition: bottom .28s ease; }
.fab { width: 48px; height: 48px; border-radius: var(--r-2); border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--float); display: grid; place-items: center; }
.fab.is-live { color: var(--mata); }
/* modo Brasil: o botão tem texto, porque o contorno sozinho não diz o que faz; ativo, ele vira o caminho de volta para SP */
.fab-txt { width: auto; justify-self: end; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 11px; font-family: var(--font-display); font-weight: 700; font-size: 15.5px; letter-spacing: .005em; }
.fab-txt svg.ic { width: 22px; height: 22px; stroke-width: 1.8; }
.fab-txt[aria-pressed="true"] { background: var(--marca-verde); color: #fff; }
.modo-brasil .chips, .modo-brasil #posPill, .modo-brasil #btnLocate { display: none; }
.uf-tag { flex: none; width: 36px; height: 30px; border-radius: var(--r-1); display: grid; place-items: center; border: 1.5px solid var(--surface-3); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.uf-tag.sp { background: var(--marca-verde); border-color: var(--marca-verde); color: #fff; }
.uf-tag.lg { width: 50px; height: 42px; font-size: 19px; }
.uf-head { display: flex; gap: 12px; align-items: center; }
.rod-list { list-style: none; margin: 0; padding: 0; }
.rod-list li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.rod-list li:last-child { border-bottom: 0; }
.rod-list .shield { flex: none; margin-top: -1px; }
.list-row.static { align-items: flex-start; }
.list-row .r-desc { display: block; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); margin-top: 4px; }
.br-cta { margin-top: 20px; display: grid; gap: 10px; justify-items: start; }
.br-cta .sec-h { margin-top: 14px; }
.pos-pill { position: absolute; left: var(--gutL); bottom: calc(var(--sheet-h) + var(--nav-h) + 22px); z-index: 450; max-width: calc(100% - 128px); display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: var(--r-2); border: 0; background: var(--surface); box-shadow: var(--float); font-size: 13.5px; color: var(--ink-2); transition: bottom .28s ease; }
.pos-pill .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos-pill b { color: var(--ink); font-weight: 700; }
.pos-pill .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mata); flex: none; box-shadow: 0 0 0 3px var(--mata-soft); }
.pos-pill.sim .dot { background: var(--ipe); box-shadow: 0 0 0 3px var(--ipe-soft); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: var(--r-1); background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 700; white-space: nowrap; }
.tag.yellow { background: var(--ipe-soft); color: var(--ink); }
.tag.green { background: var(--mata-soft); color: var(--mata); }

/* ---------- sheet ---------- */
.sheet { position: absolute; left: 0; right: 0; bottom: var(--nav-h); z-index: 600; height: var(--sheet-h); transition: height .28s ease; background: var(--surface); border-radius: var(--r-3) var(--r-3) 0 0; box-shadow: 0 -4px 18px rgba(14, 40, 52, .12); display: flex; flex-direction: column; }
.sheet-grip { flex: none; height: 24px; display: grid; place-items: center; border: 0; background: none; width: 100%; touch-action: none; cursor: grab; }
.sheet-grip span { width: 40px; height: 4px; border-radius: 2px; background: var(--surface-3); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px var(--gutR) 28px var(--gutL); -webkit-overflow-scrolling: touch; }
.hello { padding-bottom: 6px; }
.hello h2 { font-weight: 800; font-size: 22px; line-height: 1.15; }
.hello p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.link-btn { border: 0; background: none; color: var(--mata); font-weight: 700; font-size: 14px; padding: 10px 0; white-space: nowrap; }
.pict { width: 30px; height: 30px; border-radius: var(--r-1); flex: none; display: grid; place-items: center; color: #fff; background: var(--c, var(--mata)); }
.pict svg.ic { width: 17px; height: 17px; stroke-width: 2.2; }
.pict.lg { width: 40px; height: 40px; border-radius: 8px; }
.pict.lg svg.ic { width: 22px; height: 22px; }
.sec-h { font-weight: 800; font-size: 17px; line-height: 1.2; margin: 22px 0 4px; display: flex; align-items: center; gap: 8px; }
.sec-h svg.ic { width: 20px; height: 20px; color: var(--ink-2); }
.list { display: grid; }
.list-row { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 56px; text-align: left; padding: 9px 0; border: 0; border-bottom: 1px solid var(--line); background: none; }
.list-row:last-child { border-bottom: 0; }
.list-row .txt { flex: 1; min-width: 0; }
.list-row .txt strong { display: block; font-weight: 700; font-size: 15.5px; line-height: 1.25; }
.list-row .txt small { display: block; color: var(--ink-3); font-size: 13px; margin-top: 1px; }
.list-row .end { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
/* nota da paisagem: estrelas âmbar, como o acento da marca; vazias em cinza de fio */
.nota { display: inline-flex; gap: 1px; vertical-align: -2px; }
.nota svg { width: 14px; height: 14px; fill: var(--estrela-off); }
.nota svg.on { fill: var(--estrela); }
.nota.sm { display: flex; margin-top: 3px; }
.nota.sm svg { width: 12px; height: 12px; }
.nota.lg svg { width: 22px; height: 22px; }
.aval { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface); }
.aval-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.aval-top strong { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.1; }
.aval-top span { display: block; font-size: 13.5px; color: var(--ink-2); }
.aval-fontes { margin-top: 8px; }
.aval-fontes summary { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.aval-fontes summary::-webkit-details-marker { display: none; }
.aval-fontes summary .chev { width: 16px; height: 16px; color: var(--ink-3); transform: rotate(90deg); transition: transform .2s; }
.aval-fontes[open] summary .chev { transform: rotate(-90deg); }
.aval-fontes .src { margin-top: 4px; }
.aval-moto { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--ink-3); }
.aval-moto svg.ic { width: 15px; height: 15px; }
.thumb { width: 44px; height: 44px; flex: none; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; }
.thumb svg { width: 40px; height: 40px; }

/* ---------- detail ---------- */
.detail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 12px; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-2); border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.icon-btn[aria-pressed="true"] { color: var(--sol); border-color: var(--sol); background: var(--sol-soft); }
.icon-btn[aria-pressed="true"] svg { fill: currentColor; }
.detail-actions { display: flex; gap: 8px; }
.shield { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px 4px 10px 10px; background: var(--surface); color: var(--ink); font-weight: 800; font-size: 13px; border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.d-title { font-weight: 800; font-size: 28px; line-height: 1.08; margin: 2px 0 4px; }
.d-sub { color: var(--ink-2); font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.d-near { color: var(--ink-2); font-size: 14px; margin-top: 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px 0 7px; border-radius: var(--r-1); border: 1.5px solid var(--surface-3); color: var(--ink); font-size: 13px; font-weight: 700; white-space: nowrap; }
.badge svg.ic { width: 17px; height: 17px; }
.badge.official { background: var(--placa); border-color: var(--placa); color: #fff; }
.sign { width: 18px; height: 18px; flex: none; }
.sign .fill { fill: var(--ipe); stroke: #1E1A10; stroke-width: 1.3; }
.sign .glyph { fill: none; stroke: #1E1A10; stroke-width: 1.8; stroke-linecap: round; }

/* placa verde de indicação: abre cada rota e resume o estado em números na apresentação */
.placa { background: var(--placa); color: #fff; border-radius: var(--r-2); padding: 5px; }
.placa-in { border: 2.5px solid rgba(255, 255, 255, .95); border-radius: 7px; padding: 10px 12px 8px; display: grid; gap: 4px; }
.placa .shield { border-color: #fff; background: #fff; color: var(--placa); }
.pr-codes { display: flex; gap: 6px; flex-wrap: wrap; }
.pr-name { font-weight: 800; font-size: 25px; line-height: 1.05; }
.pr-sub { font-size: 14.5px; font-weight: 600; opacity: .92; }
.pr-rows { margin: 4px 0 0; padding-top: 4px; border-top: 2px solid rgba(255, 255, 255, .55); display: grid; }
.pr-rows div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 1px 0; }
.pr-rows dt { font-size: 14.5px; font-weight: 600; }
.pr-rows dd { margin: 0; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

.profile { margin: 14px 0; padding: 12px 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.profile-head { display: grid; gap: 1px; font-size: 13.5px; color: var(--ink-2); }
.profile-head strong { color: var(--ink); font-size: 15px; }
.profile svg { width: 100%; height: 70px; display: block; margin: 8px 0 2px; }
.profile-axis { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.prose { color: var(--ink-2); font-size: 15.5px; max-width: 62ch; }
.cta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 8px; }
.cta-row .wide { grid-column: 1 / -1; }
.cta-row.second { margin-top: 0; }
.cta-row.second .btn { min-height: 44px; padding: 0 10px; gap: 6px; font-size: 14px; border-color: transparent; background: var(--surface-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--r-2); border: 1.5px solid var(--surface-3); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; text-align: center; }
.btn.primary { background: var(--mata); border-color: var(--mata); color: var(--mata-ink); }
.btn.sun { background: var(--ipe); border-color: var(--ipe); color: var(--ipe-ink); }
.btn.danger { background: var(--alerta); border-color: var(--alerta); color: var(--alerta-ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--mata); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.protocol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.protocol li { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; font-size: 15px; color: var(--ink); border-bottom: 1px solid var(--line); }
.protocol li svg.ic { width: 18px; height: 18px; margin-top: 2px; color: var(--sol); }
.protocol li.sos svg.ic { color: var(--alerta); }
.src { font-size: 12.5px; color: var(--ink-3); display: grid; gap: 4px; margin-top: 16px; }
.src a { color: var(--ink-2); text-decoration-color: var(--surface-3); }
.note { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; display: flex; gap: 6px; align-items: flex-start; }
.note svg.ic { width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.checkin-box { margin: 14px 0; padding: 14px; border-radius: var(--r-2); background: var(--ipe-soft); display: grid; gap: 10px; }
.checkin-box p { font-size: 14.5px; color: var(--ink); }
.checkin-box .cta-row { margin: 0; grid-template-columns: 1fr; }
.stamp-done { display: flex; align-items: center; gap: 10px; color: var(--ok); font-weight: 700; }

/* ---------- nav ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: var(--nav-h); z-index: 800; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); align-items: stretch; padding: 0 var(--gutR) 0 var(--gutL); }
.nav button { border: 0; background: none; color: var(--ink-3); display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 4px 0; position: relative; min-width: 0; }
.nav button .ico { width: 40px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] .ico { color: var(--mata); }
/* a aba ativa ganha a faixa amarela da estrada */
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 50%; width: 36px; margin-left: -18px; height: 3px; border-radius: 0 0 3px 3px; background: var(--ipe); }
.nav .count { position: absolute; top: 6px; right: calc(50% - 26px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--sol); color: #fff; font-size: 11px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

/* ---------- pages ---------- */
.page { position: absolute; left: 0; right: 0; top: 0; bottom: var(--nav-h); z-index: 700; background: var(--surface); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.page-top { padding: 20px var(--gutR) 6px var(--gutL); display: grid; gap: 12px; }
.page-top .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-top .row.mid { align-items: center; }
.page-top h1 { font-weight: 800; font-size: 30px; line-height: 1.05; }
.page-top p { font-size: 14px; color: var(--ink-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
.page-body { padding: 10px var(--gutR) 40px var(--gutL); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.page-cp, .page-sobre { padding-top: 20px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: var(--r-2); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; min-height: 38px; padding: 0 14px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(23, 42, 51, .12); }
.h-sub { font-weight: 800; font-size: 18px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: -6px; }
.tile { display: flex; gap: 10px; align-items: center; min-height: 60px; text-align: left; border-radius: var(--r-2); border: 1.5px solid var(--line); background: var(--surface); padding: 8px 10px; }
.tile[aria-pressed="true"] { border-color: var(--mata); background: var(--mata-soft); }
.t-ico { width: 36px; height: 36px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); }
.t-ico .sign { width: 24px; height: 24px; }
.t-txt { min-width: 0; }
.t-txt strong { display: block; font-weight: 800; font-size: 14.5px; line-height: 1.15; }
.t-txt small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.filters { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.filters summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 50px; cursor: pointer; font-weight: 700; font-size: 15px; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary .chev { margin-left: auto; color: var(--ink-3); transition: transform .2s; }
.filters[open] summary .chev { transform: rotate(90deg); }
.fcount { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: var(--surface); font-size: 12px; display: grid; place-items: center; }
.fbody { display: grid; gap: 12px; padding: 2px 0 16px; }
.fgroup { display: grid; gap: 6px; }
.fgroup > span { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 5px; min-height: 38px; padding: 0 12px 0 10px; border-radius: 8px; border: 1.5px solid var(--surface-3); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.fchip svg.ic { width: 17px; height: 17px; }
.frow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.frow label { min-width: 0; }
.select { height: 44px; width: 100%; border-radius: var(--r-2); border: 1.5px solid var(--surface-3); background-color: var(--surface); color: var(--ink); padding: 0 10px; font-size: 14px; font-weight: 600; }
.results-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); margin-bottom: -8px; }
.rlist { display: grid; border-top: 1px solid var(--line); }
.results-h b { color: var(--ink); font-variant-numeric: tabular-nums; }
.route-card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; text-align: left; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; }
.route-card .shape { width: 64px; height: 64px; border-radius: var(--r-2); background: var(--surface-2); display: grid; place-items: center; }
.route-card .shape svg { width: 58px; height: 58px; }
.rc-name { display: block; font-weight: 800; font-size: 18px; line-height: 1.15; }
.route-card .ft { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; display: block; }
.route-card .badges { margin: 8px 0 8px; }
.route-card .badge { height: 26px; font-size: 12.5px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.facts span { display: inline-flex; align-items: center; gap: 5px; }
.facts svg.ic { width: 15px; height: 15px; color: var(--ink-3); }
.facts .done { color: var(--ok); font-weight: 700; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1.5px dashed var(--surface-3); border-radius: var(--r-3); display: grid; gap: 10px; justify-items: center; }
.exp-card { border-radius: var(--r-3); overflow: hidden; background: var(--surface); border: 1.5px solid var(--line); }
.exp-art { border-bottom: 1px solid var(--line); background: var(--sea); }
.exp-art svg { display: block; width: 100%; height: auto; }
.exp-body { padding: 14px 16px 16px; display: grid; gap: 10px; }
.exp-body h3 { font-size: 21px; font-weight: 800; line-height: 1.1; }
.exp-stops { font-size: 14px; color: var(--ink-2); }
.exp-routes { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--surface-3); background: var(--surface); font-size: 13.5px; font-weight: 600; }
.mini-chip i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }

/* início: painel do motociclista; o odômetro imita os tambores do painel da moto */
.home-brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; border: 0; background: none; padding: 0; font-weight: 800; font-size: 17px; color: var(--ink); }
.home-brand svg { width: 36px; height: 36px; }
.page-top .sos-btn { height: 44px; box-shadow: none; }

.painel { background: var(--painel); color: var(--painel-ink); border-radius: var(--r-3); padding: 16px; display: grid; gap: 10px; }
.painel h2 { font-size: 14px; font-weight: 700; color: var(--painel-ink-2); }
.odo { display: flex; align-items: stretch; gap: 3px; }
.odo span { flex: 1 1 0; min-width: 0; max-width: 46px; height: 54px; display: grid; place-items: center; border-radius: 5px; background: linear-gradient(var(--drum-shade), transparent 32%, transparent 68%, var(--drum-shade)), var(--drum); color: var(--drum-ink); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.odo .dec { margin-left: 3px; background: linear-gradient(var(--drum-shade), transparent 32%, transparent 68%, var(--drum-shade)), var(--drum-dec); color: var(--drum-dec-ink); }
.odo b { align-self: flex-end; margin-left: 6px; font-size: 15px; font-weight: 700; color: var(--painel-ink-2); }
.painel-sub { font-size: 14px; color: var(--painel-ink-2); }
.trips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 2px 0 0; padding-top: 12px; border-top: 1px solid var(--painel-line); }
.trips div { min-width: 0; }
.trips dt { font-size: 13px; font-weight: 600; color: var(--painel-ink-2); }
.trips dd { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.1; }
.trips dd small { font-size: 14px; font-weight: 600; color: var(--painel-ink-2); }

/* checkpoint: cartão do motociclista, com a moldura dourada gravada */
.cp-card { border-radius: var(--r-3); padding: 18px 20px 20px; color: var(--cp-gold); background: var(--cp-cover); box-shadow: inset 0 0 0 7px var(--cp-cover), inset 0 0 0 8.5px color-mix(in srgb, var(--cp-gold) 60%, transparent); }
.cp-card .cp-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cp-emblem { width: 46px; height: 46px; color: var(--cp-gold); }
.cp-count { text-align: right; font-size: 13px; font-weight: 600; line-height: 1.2; }
.cp-count b { display: block; font-size: 42px; font-weight: 800; line-height: 1; }
.cp-kicker { display: block; margin-top: 18px; font-size: 14px; font-weight: 600; opacity: .9; }
.cp-card h1 { font-size: 40px; font-weight: 800; line-height: 1; color: var(--cp-gold); }
.cp-card .cp-name { margin-top: 18px; display: grid; gap: 5px; }
.cp-card .cp-name small { font-size: 13px; font-weight: 600; opacity: .9; }
.cp-card input { background: color-mix(in srgb, var(--cp-gold) 10%, transparent); border: 1px solid color-mix(in srgb, var(--cp-gold) 45%, transparent); border-radius: 8px; padding: 10px 12px; color: #FFF6DC; font-size: 16px; font-weight: 700; width: 100%; max-width: 280px; }
.cp-card input::placeholder { color: color-mix(in srgb, var(--cp-gold) 70%, transparent); }
.progress-list { display: grid; gap: 14px; padding: 4px 0 2px; }
.prog { display: grid; gap: 6px; }
.prog-top { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 700; }
.prog-top span { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--mata); }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 14px 10px; }
.stamp-btn { border: 0; background: none; padding: 0; }
.stamp-btn, .stamps > .stamp { align-self: start; }
.stamp { display: grid; justify-items: center; gap: 5px; text-align: center; color: var(--ink-3); }
.stamp .seal { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--surface-3); color: var(--ink-3); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.stamp .seal svg.ic { width: 26px; height: 26px; }
.stamp.got .seal { border: 3px double var(--c, var(--sol)); color: var(--c, var(--sol)); transform: rotate(var(--rot, -8deg)); background: color-mix(in srgb, var(--c, var(--sol)) 8%, var(--surface)); }
.stamp.locked .seal { opacity: .5; }
.stamp small { font-size: 12.5px; line-height: 1.2; color: var(--ink); font-weight: 600; }
.stamp em { font-style: normal; font-size: 12px; color: var(--ink-3); }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.medal { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--r-2); border: 1.5px solid var(--line); opacity: .6; }
.medal.got { opacity: 1; border-color: var(--ipe); background: var(--ipe-soft); }
.medal .m-ico { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); flex: none; }
.medal.got .m-ico { background: var(--ipe); color: var(--ipe-ink); }
.medal strong { display: block; font-size: 14px; line-height: 1.15; }
.medal small { display: block; font-size: 12.5px; color: var(--ink-3); line-height: 1.25; }

/* comunidade */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.switch strong { font-size: 15.5px; }
.switch small { display: block; font-size: 13.5px; color: var(--ink-2); }
.toggle { width: 52px; height: 32px; border-radius: 16px; border: 0; background: var(--surface-3); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.toggle[aria-pressed="true"] { background: var(--mata); }
.toggle[aria-pressed="true"]::after { transform: translateX(20px); }
.sug { border-radius: var(--r-3); border: 1.5px solid var(--line); padding: 14px; display: grid; gap: 10px; }
.sug-top { display: flex; gap: 12px; align-items: flex-start; }
.sug-top .txt { flex: 1; min-width: 0; }
.sug-top strong { display: block; font-size: 16px; line-height: 1.25; }
.sug-top small { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.status { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: var(--r-1); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.status.analise { background: var(--ipe-soft); color: var(--ink); }
.status.aprovado { background: var(--mata-soft); color: var(--mata); }
.status.recusado { background: var(--alerta-soft); color: var(--alerta); }
.sug p { font-size: 15px; color: var(--ink-2); }
.sug img { width: 100%; max-height: 170px; object-fit: cover; border-radius: var(--r-2); }
.sug-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sug-actions .btn { min-height: 44px; padding: 0 14px; font-size: 14px; }
.sug-foot { font-size: 12.5px; color: var(--ink-3); }
.amen { display: flex; flex-wrap: wrap; gap: 6px; }
.amen span { font-size: 13px; padding: 3px 9px; border-radius: var(--r-1); background: var(--surface-2); color: var(--ink-2); font-weight: 600; }

/* segurança: o bloco de emergência tem a faixa vermelha das placas de socorro */
.sos-panel { border-radius: var(--r-3); border: 2px solid var(--alerta); padding-bottom: 14px; display: grid; gap: 12px; overflow: hidden; }
.sos-panel > :not(h2) { margin-inline: 14px; }
.sos-panel h2 { background: var(--alerta); color: var(--alerta-ink); padding: 10px 14px; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sos-panel h2 svg.ic { width: 20px; height: 20px; stroke-width: 2.2; }
.calls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.call { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-2); border: 1.5px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.call b { font-size: 32px; font-weight: 800; line-height: 1; color: var(--alerta); user-select: all; font-variant-numeric: tabular-nums; }
.call span { font-size: 15px; font-weight: 700; }
.call small { font-size: 13px; color: var(--ink-2); line-height: 1.25; }
.where { padding: 12px; border-radius: var(--r-2); background: var(--surface-2); display: grid; gap: 8px; }
.where .coords { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }
.where .row { display: flex; gap: 8px; flex-wrap: wrap; }
.where .row .btn { min-height: 44px; font-size: 14px; padding: 0 14px; }
.steps { counter-reset: s; display: grid; gap: 12px; margin: 0; padding: 0; }
.steps li { list-style: none; counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; font-size: 15px; color: var(--ink-2); }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--alerta); color: var(--alerta-ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.steps li b { display: block; color: var(--ink); }
.checklist { display: grid; border-top: 1px solid var(--line); }
.check { display: flex; align-items: center; gap: 12px; padding: 11px 0; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; font-size: 15px; }
.check .box { width: 26px; height: 26px; border-radius: var(--r-1); border: 2px solid var(--surface-3); display: grid; place-items: center; flex: none; color: transparent; }
.check[aria-pressed="true"] .box { background: var(--mata); border-color: var(--mata); color: var(--mata-ink); }
.check[aria-pressed="true"] span { color: var(--ink-3); text-decoration: line-through; }
.check .box svg.ic { width: 16px; height: 16px; stroke-width: 3; }
.acc { border-bottom: 1px solid var(--line); }
.acc:first-child { border-top: 1px solid var(--line); }
.acc summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 52px; cursor: pointer; font-weight: 700; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .chev { margin-left: auto; transition: transform .2s; color: var(--ink-3); }
.acc[open] summary .chev { transform: rotate(90deg); }
.acc ul { margin: 0; padding: 0 0 14px 58px; display: grid; gap: 6px; font-size: 15px; color: var(--ink-2); }
.feature { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; }
.feature + .feature { border-top: 1px solid var(--line); }
.feature strong { display: block; font-size: 15.5px; }
.feature small { display: block; font-size: 14px; color: var(--ink-2); }
.panel { padding: 0; }

/* modals */
.modal { position: absolute; inset: 0; z-index: 900; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(10, 26, 33, .45); }
.modal-panel { background: var(--surface); border-radius: var(--r-3) var(--r-3) 0 0; max-height: 100%; height: 100%; display: flex; flex-direction: column; padding-top: 10px; animation: rise .26s ease; }
.modal-panel.short { height: auto; max-height: 88%; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px var(--gutR) 12px var(--gutL); }
.modal-head h2 { font-weight: 800; font-size: 24px; line-height: 1.08; }
.modal-head p { font-size: 14px; color: var(--ink-2); margin-top: 3px; }
.modal-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px var(--gutR) 28px var(--gutL); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }
.modal-foot { padding: 12px var(--gutR) 14px var(--gutL); border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 8px; }
.modal-foot .btn { flex: 1 1 auto; }
.modal-foot .btn:not(.primary) { flex: 0 0 auto; padding: 0 22px; }
.field { display: grid; gap: 7px; }
.field > label, .field > span { font-size: 14px; font-weight: 700; color: var(--ink); }
.field input[type="text"], .field input[type="tel"], .field input[type="search"], .field textarea { width: 100%; border: 1.5px solid var(--surface-3); background: var(--surface); border-radius: var(--r-2); padding: 12px 14px; font-size: 16px; color: var(--ink); }
.field textarea { min-height: 88px; resize: vertical; }
.field .hint { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.field .err { color: var(--alerta); font-size: 13.5px; font-weight: 600; }
.loc-box { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-2); background: var(--surface-2); }
.loc-box .row { display: flex; gap: 8px; flex-wrap: wrap; }
.loc-box .row .btn { flex: 1; min-height: 44px; font-size: 14px; padding: 0 10px; gap: 6px; }
.loc-val { font-size: 14px; color: var(--ink-2); }
.loc-val b { color: var(--ink); }
.photo-in { display: flex; align-items: center; gap: 12px; }
.photo-in label.btn { cursor: pointer; }
.photo-in img { width: 78px; height: 78px; object-fit: cover; border-radius: var(--r-2); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }

/* map overlays */
.crosshair { position: absolute; inset: 0; z-index: 650; pointer-events: none; display: grid; place-items: center; }
.crosshair .pin-c { width: 46px; height: 46px; margin-top: -46px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
.crosshair .pin-c svg { width: 46px; height: 46px; }
.pick-bar { position: absolute; left: var(--gutL); right: var(--gutR); bottom: calc(var(--nav-h) + 14px); z-index: 660; background: var(--surface); border-radius: var(--r-3); box-shadow: var(--float); padding: 14px; display: grid; gap: 10px; }
.pick-bar p { font-size: 14.5px; color: var(--ink-2); }
.pick-bar .row { display: flex; gap: 8px; }
.pick-bar .row .btn { flex: 1; }
.sim-bar { position: absolute; left: var(--gutL); right: var(--gutR); top: 124px; z-index: 640; background: var(--surface); color: var(--ink); border-radius: var(--r-3); padding: 10px 12px 12px; display: grid; gap: 8px; box-shadow: var(--float); }
.sim-top { display: flex; align-items: center; gap: 10px; }
.sim-top .txt { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink-2); }
.sim-top .txt b { display: block; font-size: 15.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sim-bar .bar i { background: var(--ipe); }
.toast { position: absolute; left: var(--gutL); right: var(--gutR); bottom: calc(var(--nav-h) + 14px); z-index: 1000; background: var(--ink); color: var(--surface); border-radius: var(--r-2); padding: 13px 15px; font-size: 14.5px; box-shadow: var(--float); display: flex; gap: 10px; align-items: flex-start; animation: rise .22s ease; }
.toast svg.ic { color: var(--ipe); width: 20px; height: 20px; margin-top: 1px; }
.legend { position: absolute; right: calc(var(--gutR) + 56px); bottom: calc(var(--sheet-h) + var(--nav-h) + 22px); z-index: 455; width: 238px; background: var(--surface); border-radius: var(--r-3); box-shadow: var(--float); padding: 14px; display: grid; gap: 9px; font-size: 13.5px; }
.legend h3 { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 2px; }
.lg-row { display: flex; align-items: center; gap: 10px; }
.lg-row svg { width: 44px; height: 12px; flex: none; }
.lg-opts { display: grid; gap: 6px; }
.lg-opt { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--surface-3); border-radius: var(--r-2); padding: 9px 11px; background: var(--surface); text-align: left; font-size: 13.5px; font-weight: 600; }
.lg-opt[aria-pressed="true"] { border-color: var(--mata); color: var(--mata); background: var(--mata-soft); }

/* leaflet */
.leaflet-container { background: var(--sea); font-family: var(--font); outline: none; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 82%, transparent) !important; color: var(--ink-3) !important; font-size: 10px !important; border-radius: var(--r-1) 0 0 0; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bottom { bottom: calc(var(--sheet-h) + var(--nav-h)) !important; transition: bottom .28s ease; }
/* com a folha aberta até o topo, a atribuição sairia espremida entre os chips e a folha */
.sheet-full .leaflet-control-attribution { visibility: hidden; }
.pin { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: var(--c); border: 2.5px solid var(--casing); box-shadow: 0 2px 6px rgba(14, 32, 40, .3); transition: transform .15s; position: relative; }
.pin svg.ic { width: 16px; height: 16px; stroke-width: 2.3; }
.pin .n { position: absolute; right: -8px; bottom: -7px; min-width: 19px; height: 17px; border-radius: 5px; padding: 0 4px; background: var(--ink); color: var(--surface); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; border: 1.5px solid var(--casing); font-variant-numeric: tabular-nums; }
/* sugestão da comunidade: placa branca, ainda não oficial */
.pin.com { background: var(--surface); color: var(--ink); border-color: var(--ink); border-width: 2px; }
.pin.com.pending { border-style: dashed; }
.pin.wip { opacity: .7; }
.pin.sel { transform: scale(1.22); z-index: 10; box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 30%, transparent), 0 4px 10px rgba(0,0,0,.3); }
.pin.got::after { content: ""; position: absolute; left: -5px; top: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--ipe); border: 2px solid var(--casing); }
.map--far .pin { transform: scale(.42); border-width: 4px; box-shadow: 0 2px 5px rgba(14, 32, 40, .35); }
.map--far .pin.mon { transform: scale(.5); }
.map--far .pin svg, .map--far .pin .n, .map--far .pin::after { visibility: hidden; }
.map--far .pin.sel { transform: scale(1); border-width: 2.5px; }
.map--far .pin.sel svg { visibility: visible; }
.me { width: 20px; height: 20px; border-radius: 50%; background: var(--mata); border: 3px solid var(--casing); animation: ping 2.4s infinite; }
.me.sim { background: var(--ipe); border-color: var(--ink); }
.me.moto { width: 32px; height: 32px; display: grid; place-items: center; background: var(--ipe); color: var(--ipe-ink); border: 3px solid var(--casing); animation: none; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
.me.moto svg.ic { width: 17px; height: 17px; stroke-width: 2.5; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--mata) 45%, transparent); } 70% { box-shadow: 0 0 0 16px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
/* largura do próprio texto: dentro do marcador de largura zero, o -50% centraliza de verdade e a colisão mede a caixa certa */
.map-label { width: max-content; white-space: nowrap; color: var(--label); pointer-events: none; transform: translate(-50%, -50%); font-family: var(--font); font-weight: 700; font-size: 13.5px; text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 6px var(--land); }
.map-label.sea { color: color-mix(in srgb, var(--water) 55%, var(--ink-3)); text-shadow: none; font-size: 14px; letter-spacing: .08em; }
.map-label.state { font-weight: 600; font-size: 12px; opacity: .85; text-shadow: none; letter-spacing: .02em; }
.map-label.city { font-weight: 700; font-size: 12px; color: var(--ink-2); }
.map-label.city::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); margin-right: 5px; vertical-align: 1px; }
.map-label.br-uf { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
/* placa verde própria: o desvio de rótulos pode tirá-la de cima do estado, e o texto branco precisa continuar legível */
.map-label.br-sp { display: grid; justify-items: center; color: #fff; text-shadow: none; line-height: 1.1; font-family: var(--font-display); background: var(--marca-verde); padding: 4px 8px 5px; border-radius: 6px; border: 1.5px solid rgba(255, 255, 255, .85); }
.map-label.br-sp b { font-size: 14.5px; font-weight: 700; }
.map-label.br-sp small { font-size: 11px; font-weight: 600; opacity: .85; }
.leaflet-tooltip.rt { background: var(--ink); color: var(--surface); border: 0; border-radius: var(--r-1); font-weight: 700; font-size: 13px; box-shadow: var(--float); padding: 6px 10px; }
.leaflet-tooltip.rt::before { display: none; }

/* ---------- pitch (coluna da apresentação e página Sobre) ---------- */
.pitch-in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
.p-hero { display: grid; gap: 18px; }
.p-title { display: flex; align-items: center; gap: 18px; }
.p-title svg { width: 76px; height: 76px; flex: none; }
.p-title h1 { font-weight: 800; font-size: clamp(48px, 5.4vw, 74px); line-height: .95; letter-spacing: -.01em; }
.p-tag { font-size: clamp(19px, 1.9vw, 24px); color: var(--ink-2); font-weight: 600; margin-top: 6px; }
.p-lede { font-size: 18px; line-height: 1.6; color: var(--ink-2); max-width: 62ch; }
.p-mapgrid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(250px, .8fr); gap: 18px; align-items: start; }
.p-map { margin: 0; }
.p-map svg { width: 100%; height: auto; display: block; border-radius: var(--r-3); border: 1px solid var(--line); }
.hm-reg { font-family: var(--font); font-weight: 700; font-size: 15px; fill: var(--label); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.hm-sea { font-family: var(--font); font-weight: 600; font-size: 14px; letter-spacing: .08em; fill: color-mix(in srgb, var(--water) 55%, var(--ink-3)); }
.hm-state { font-family: var(--font); font-weight: 600; font-size: 12.5px; letter-spacing: .02em; fill: var(--ink-3); opacity: .85; }
.hm-city { font-family: var(--font); font-weight: 700; font-size: 14px; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3.5px; stroke-linejoin: round; }
.p-map figcaption { font-size: 13px; color: var(--ink-2); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.p-map figcaption i { display: inline-block; width: 18px; height: 5px; border-radius: 3px; vertical-align: 3px; margin-right: 6px; }
.placa-in .ph { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; padding-bottom: 6px; border-bottom: 2px solid rgba(255, 255, 255, .55); }
.placa-in .ph .shield { height: 22px; font-size: 12.5px; }
.placa-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; font-size: 16px; }
.placa-row b { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.p-sec h2 { font-weight: 800; font-size: 28px; line-height: 1.1; margin-bottom: 14px; }
.p-sec > p { color: var(--ink-2); max-width: 64ch; font-size: 16.5px; line-height: 1.6; }
.p-sec > p + p { margin-top: 12px; }
.pitch-in .pict { background: var(--surface-2); color: var(--ink); }
.fusion { display: grid; border-top: 1px solid var(--line); }
.fus { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 14px 0; align-items: start; border-bottom: 1px solid var(--line); }
.fus strong { display: block; font-size: 19px; font-weight: 800; line-height: 1.15; }
.fus p { font-size: 15px; color: var(--ink-2); margin-top: 3px; }
.fus .from { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.fus-out { margin-top: 14px; display: flex; gap: 14px; align-items: center; }
.fus-out svg { width: 44px; height: 44px; flex: none; }
.fus-out p { font-size: 15px; color: var(--ink-2); }
.fus-out strong { font-size: 19px; font-weight: 800; display: block; color: var(--ink); }
.gain { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 28px; }
.gain div { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.gain strong { display: block; font-size: 16.5px; margin-bottom: 3px; }
.gain p { font-size: 15px; color: var(--ink-2); }
.bench-wrap { overflow-x: auto; border-top: 2px solid var(--ink); }
.bench { width: 100%; border-collapse: collapse; font-size: 15px; }
.bench th, .bench td { text-align: left; padding: 11px 14px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.bench th { font-size: 13.5px; color: var(--ink-2); font-weight: 700; }
.bench td:first-child { font-weight: 700; white-space: nowrap; }
.road { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.road > div { border-top: 3px solid var(--ink); padding-top: 12px; }
.road h3 { font-size: 20px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.road ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; color: var(--ink-2); }
.howto { counter-reset: h; display: grid; gap: 10px; margin: 0; padding: 0; }
.howto li { list-style: none; counter-increment: h; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: 15.5px; color: var(--ink-2); }
.howto li::before { content: counter(h); width: 30px; height: 30px; border-radius: 6px; background: var(--ipe); color: var(--ipe-ink); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.howto li b { color: var(--ink); }
.p-foot { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 8px; }
.p-foot ul { margin: 0; padding-left: 18px; columns: 2; column-gap: 32px; }
.p-foot li { break-inside: avoid; margin-bottom: 3px; }
.p-foot a { color: var(--ink-2); }
.page .pitch-in { gap: 28px; }
.page .p-title { gap: 14px; }
.page .p-title svg { width: 48px; height: 48px; }
.page .p-title h1 { font-size: 34px; }
.page .p-tag { font-size: 17px; }
.page .p-lede { font-size: 16px; }
.page .p-mapgrid, .page .gain, .page .road { grid-template-columns: 1fr; }
.page .p-foot ul { columns: 1; }

/* títulos em Overpass pesada, a letra das placas de rodovia; números em Overpass Mono, como odômetro e marco quilométrico */
.hello h2, .sec-h, .d-title, .pr-name, .page-top h1, .h-sub, .t-txt strong, .rc-name, .exp-body h3, .cp-card h1,
.sos-panel h2, .modal-head h2, .p-title h1, .p-sec h2, .fus strong, .road h3, .list-row .txt strong, .home-brand, .placa-in .ph, .shield,
.hm-reg, .hm-city { font-family: var(--font-display); letter-spacing: -.01em; }
.pr-rows dd, .cp-count b, .stamp .seal, .call b, .odo span, .trips dd, .placa-row b, .pin .n, .list-row .end, .profile-axis, .uf-tag { font-family: var(--font-num); letter-spacing: 0; }
.hello h2 { font-size: 23px; font-weight: 800; }
.sec-h { font-size: 17px; font-weight: 800; }
.d-title { font-size: 28px; font-weight: 800; line-height: 1.05; }
.pr-name { font-size: 24px; font-weight: 800; }
.pr-rows dt { font-size: 14.5px; }
.pr-rows dd { font-size: 19px; font-weight: 700; }
.page-top h1 { font-size: 30px; font-weight: 900; }
.h-sub { font-size: 18px; font-weight: 800; }
.t-txt strong { font-size: 14.5px; font-weight: 700; }
.rc-name { font-size: 18px; font-weight: 800; }
.exp-body h3 { font-size: 21px; font-weight: 800; }
.cp-card h1 { font-size: 40px; font-weight: 900; }
.cp-count b { font-size: 40px; font-weight: 700; }
.stamp .seal { font-size: 22px; font-weight: 700; }
.sos-panel h2 { font-size: 20px; font-weight: 800; }
.call b { font-size: 32px; font-weight: 700; }
.modal-head h2 { font-size: 24px; font-weight: 800; }
.odo span { font-size: 30px; font-weight: 600; }
.trips dd { font-size: 26px; font-weight: 600; }
.p-title h1 { font-size: clamp(44px, 5vw, 64px); font-weight: 900; letter-spacing: -.02em; }
.p-sec h2 { font-size: 26px; font-weight: 800; }
.placa-row b { font-size: 28px; font-weight: 700; }
.fus strong { font-size: 18px; font-weight: 800; }
.road h3 { font-size: 19px; font-weight: 800; }
.list-row .txt strong { font-size: 15.5px; font-weight: 700; }
.home-brand { font-size: 18px; font-weight: 800; }
.placa-in .ph { font-size: 16px; font-weight: 800; }
/* monumento: âmbar com pictograma em grafite (branco sobre âmbar não passa no contraste) */
.pict[style*="c-monumento"], .pin[style*="c-monumento"], .chip[style*="c-monumento"]:not([aria-pressed="false"]) .pict { color: var(--marca-asfalto); }
.nav .count { color: var(--ipe-ink); }
/* a marca: ícone com cantos próprios; o emblema na capa do Checkpoint e no título da apresentação */
.brand-btn { background: transparent; box-shadow: none; }
.brand-btn svg { width: 44px; height: 44px; }
.home-brand svg { width: 36px; height: 36px; }
.cp-emblem { width: 96px; height: 96px; }
.p-title svg { width: 96px; height: 96px; }
.page .p-title svg { width: 56px; height: 56px; }

/* passar o mouse só onde existe mouse */
@media (hover: hover) {
  .btn:not([disabled]):hover { border-color: var(--ink-3); }
  .btn.primary:not([disabled]):hover { background: color-mix(in srgb, var(--mata) 88%, #000); border-color: transparent; }
  .btn.sun:hover { background: color-mix(in srgb, var(--ipe) 90%, #000); border-color: transparent; }
  .icon-btn:hover, .fab:hover, .brand-btn:hover, .chip:hover { background: var(--surface-2); }
  .list-row:hover .txt strong, .route-card:hover .rc-name, .sr-item:hover strong { color: var(--mata); }
  .sr-item:hover { background: var(--surface-2); }
  .tile:hover, .fchip:hover, .mini-chip:hover, .lg-opt:hover, .call:hover { border-color: var(--ink-3); }
  .fchip[aria-pressed="true"]:hover { border-color: var(--ink); }
  .nav button:hover { color: var(--ink); }
  .seg button:hover, .filters summary:hover, .acc summary:hover { color: var(--ink); }
  .stamp-btn:hover .seal { border-color: var(--ink-3); }
  .link-btn:hover, .src a:hover { text-decoration: underline; }
}


/* ---------- v6: placa verde no alto, asfalto no mapa, marrom de turismo nos pontos ---------- */
.brand-name { display: none; }
.nav .nav-sobre { display: none; }

/* topo do celular: uma placa verde colada na borda, não cartões soltos sobre o mapa */
.topbar { background: var(--placa); padding: 10px var(--gutR) 0 var(--gutL); gap: 8px; pointer-events: auto; box-shadow: 0 1px 0 rgba(0, 0, 0, .45); }
.brand-btn { width: 44px; height: 44px; border-radius: 0; }
.search { height: 44px; padding: 0 12px; border-radius: var(--r-1); box-shadow: none; }
.search:focus-within { box-shadow: 0 0 0 3px var(--ipe); }
.sos-btn { height: 44px; padding: 0 13px 0 10px; border-radius: var(--r-1); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .9); letter-spacing: .03em; }
.chips { gap: 6px; padding: 2px var(--gutR) 10px var(--gutL); }
.chip { height: 32px; padding: 0 10px 0 4px; gap: 6px; border-radius: var(--r-1); background: var(--surface); color: var(--ink); box-shadow: none; font-size: 13.5px; }
.chip .pict { width: 24px; height: 24px; border-radius: var(--r-1); }
.chip[aria-pressed="false"] { background: transparent; color: rgba(255, 255, 255, .84); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
.chip[aria-pressed="false"] .pict { background: rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .84); }
.search-results { top: 60px; border-radius: var(--r-2); box-shadow: var(--float), 0 10px 28px rgba(0, 0, 0, .28); }

/* sobre o mapa: botões quadrados com fio, sem sombra de cartão */
.fab { height: 44px; border-radius: var(--r-1); }
.fab:not(.fab-txt) { width: 44px; }
.pos-pill { height: 36px; border-radius: var(--r-1); }
.legend { border-radius: var(--r-2); box-shadow: var(--float), 0 10px 28px rgba(0, 0, 0, .3); }
.tag { border-radius: var(--r-1); }
.leaflet-tooltip.rt { border-radius: var(--r-1); }
.sim-bar, .pick-bar { border-radius: var(--r-2); }
.leaflet-control-scale { display: none; }
.leaflet-control-scale-line { background: rgba(255, 255, 255, .88); border-color: var(--marca-asfalto); color: var(--marca-asfalto); font-family: var(--font-num); font-size: 11px; text-shadow: none; }

/* folha: painel chapado, sem cantos de cartão */
.sheet { border-radius: 0; box-shadow: 0 -1px 0 rgba(0, 0, 0, .5); }
.sheet-grip span { width: 36px; border-radius: 0; }

/* abas: a ativa ganha a faixa amarela no alto */
.nav button[aria-current="page"]::before { width: 44px; margin-left: -22px; height: 4px; border-radius: 0; }

/* miniaturas de rota: um pedaço do mesmo asfalto do mapa */
.thumb, .route-card .shape { background: var(--land); border-radius: var(--r-1); }

/* pontos: placa marrom de atrativo turístico, borda branca */
.pin { width: 28px; height: 28px; border-radius: var(--r-1); border: 2px solid var(--pin-edge); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 2px 4px rgba(0, 0, 0, .45); }
.pin .n { background: var(--pin-edge); color: var(--marca-asfalto); border-color: var(--marca-asfalto); border-radius: var(--r-1); font-weight: 700; }
.pin.com { background: var(--pin-edge); color: var(--marca-asfalto); border-color: var(--marca-asfalto); }
.pin.sel { box-shadow: 0 0 0 3px var(--marca-asfalto), 0 0 0 6px var(--ipe); }
.pin.got::after { border-radius: 0; border-color: var(--marca-asfalto); }
.me, .me.sim, .me.moto { border-color: var(--pin-edge); }

/* rótulos claros sobre o asfalto: regiões em versal espaçada e mar em itálico, como nas cartas rodoviárias */
.map-label { color: var(--label); font-weight: 600; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.map-label.city, .map-label.state, .map-label.sea, .map-label.br-uf, .map-label.br-sp { text-transform: none; }
.map-label.city { color: var(--label-city); font-size: 12.5px; font-weight: 700; letter-spacing: 0; }
.map-label.city::before { background: var(--label-city); box-shadow: 0 0 0 1.5px var(--land); }
.map-label.state { color: var(--label); font-size: 12px; letter-spacing: .02em; }
.map-label.sea { color: color-mix(in srgb, var(--water) 40%, var(--label)); font-style: italic; font-size: 13px; letter-spacing: .05em; }
.hm-reg { text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 600; }
.hm-city { fill: var(--label-city); }
.hm-state { fill: var(--label); }
.hm-sea { fill: color-mix(in srgb, var(--water) 40%, var(--label)); font-style: italic; }
.p-map figcaption i { border-radius: 1px; box-shadow: 0 0 0 1.5px var(--casing); }

/* início: a placa com a marca, a foto inteira com o crédito embaixo e o cumprimento no papel */
.inicio-band { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px var(--gutR) 10px var(--gutL); background: var(--placa); }
.inicio-band .home-brand { color: #fff; }
.inicio-band .sos-btn { height: 40px; }
.inicio-foto { margin: 0; }
.inicio-foto img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover; object-position: center 45%; }
.inicio-foto figcaption { padding: 6px var(--gutR) 0 var(--gutL); font-size: 11.5px; line-height: 1.35; color: var(--ink-3); }
.inicio-foto figcaption a { color: inherit; text-decoration: none; }
.inicio-foto figcaption a:hover, .inicio-foto figcaption a:focus-visible { text-decoration: underline; }
.inicio-top .page-top { gap: 2px; padding-top: 16px; padding-bottom: 2px; }
.inicio-top .page-top h1 { font-size: 34px; }
.painel { border-radius: var(--r-2); }
.odo span { border-radius: var(--r-1); }

/* apresentação: sem ícones de enfeite; a origem de cada parte fica à esquerda, como numa tabela */
.fus { grid-template-columns: 8.5rem minmax(0, 1fr); gap: 16px; }
.fus .from { padding-top: 4px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.page .fus { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.gain div { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.howto li::before { width: 28px; height: 28px; border-radius: var(--r-1); background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); font-family: var(--font-num); font-weight: 700; font-size: 15px; }

@media (hover: hover) {
  .brand-btn:hover { background: transparent; opacity: .88; }
  .chip[aria-pressed="false"]:hover { background: rgba(255, 255, 255, .1); }
}

/* computador: app de mapa em tela cheia. Faixa verde no alto (marca, abas, SOS), coluna de 400 px, o mapa no resto */
@media (min-width: 980px) {
  .app { --nav-h: 0px; --sheet-h: 0px !important; }
  #map { top: var(--hdr-h); left: var(--panel-w); }
  .topbar { right: auto; width: var(--panel-w); padding: 0 16px 14px; gap: 0; background: linear-gradient(var(--placa) 0 var(--hdr-h), var(--surface) var(--hdr-h)); box-shadow: inset -1px 0 0 var(--line), 0 1px 0 var(--line); }
  .bar-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .brand-btn { justify-self: start; width: auto; height: var(--hdr-h); display: inline-flex; align-items: center; gap: 12px; color: #fff; }
  .brand-btn svg { width: 40px; height: 40px; }
  .brand-name { display: inline; font-family: var(--font-display); font-weight: 900; font-size: 21px; letter-spacing: -.015em; }
  .search { box-shadow: inset 0 0 0 1px var(--surface-3); }
  .search:focus-within { box-shadow: inset 0 0 0 1px var(--surface-3), 0 0 0 3px var(--ipe); }
  .sos-btn { position: fixed; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 950; height: 40px; }
  .chips { position: fixed; top: calc(var(--hdr-h) + 12px); left: calc(var(--panel-w) + 16px); right: 16px; margin: 0; padding: 0; flex-wrap: wrap; overflow: visible; }
  .search-results { top: calc(var(--hdr-h) + 64px); left: 16px; right: auto; width: calc(var(--panel-w) - 32px); max-height: 60vh; }

  .nav { top: 0; bottom: auto; left: var(--panel-w); right: 0; z-index: 400; height: var(--hdr-h); display: flex; align-items: stretch; padding: 0 128px 0 8px; background: var(--placa); border-top: 0; }
  .nav button { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 15px; color: rgba(255, 255, 255, .74); }
  .nav button:hover { color: #fff; }
  .nav button .ico { width: auto; height: auto; }
  .nav button[aria-current="page"], .nav button[aria-current="page"] .ico { color: #fff; }
  .nav button[aria-current="page"]::before { top: auto; bottom: 0; left: 14px; right: 14px; width: auto; margin: 0; }
  .nav .count { position: static; margin-left: -2px; }
  .nav .nav-sobre { display: inline-flex; margin-left: auto; }

  .sheet { top: var(--panel-top); right: auto; bottom: 0; width: var(--panel-w); height: auto; transition: none; box-shadow: inset -1px 0 0 var(--line); }
  .sheet-grip { display: none; }
  .sheet-body { padding-top: 18px; }

  #page-sobre { width: min(760px, 100%); }
  .inicio-band { display: none; }

  .leaflet-control-scale { display: block; }
  .pick-bar, .toast { left: calc(var(--panel-w) + 16px); right: auto; width: min(460px, calc(100% - var(--panel-w) - 32px)); }

  .modal { align-items: center; justify-content: center; }

  .modal-panel.short { height: auto; max-height: min(86vh, 820px); }
}

function projectRoute(r, W, H, pad) {

/* ------------------------------------------------------------------ simulation */
function pointAt(r, dist) {
  const c = r.cum; let lo = 0, hi = c.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; if (c[m] <= dist) lo = m; else hi = m; }
  const seg = c[hi] - c[lo] || 1, t = Math.min(1, Math.max(0, (dist - c[lo]) / seg)), a = r.ll[lo], b = r.ll[hi];

function closeModal() { $$('#overlay .modal').forEach(m => m.remove()); }
function modal(html, opts = {}) {
  closeModal();
  const el = document.createElement('div'); el.className = 'modal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="modal-panel ${opts.short ? 'short' : ''}">${html}</div>`;
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) closeModal(); });
  $('#overlay').appendChild(el); return el;
}

// static drawings of the same basemap: the whole state on the pitch, one region per experience
let RINGS = null;
const rings = () => RINGS || (RINGS = { sp: BASE.sp.map(poly => poly.map(decode)), nb: BASE.nb.map(st => st.p.map(poly => poly.map(decode))) });
function mapSvg({ W, H, bounds, routes, labels = [], cities = [], mons = false, capital = false, aria }) {
  let [[minLa, minLo], [maxLa, maxLo]] = bounds;

  const near = ring => ring.some(p => p[1] > minLo - 1 && p[1] < maxLo + 1 && p[0] > minLa - 1 && p[0] < maxLa + 1);
  const path = pts => pts.map((p, i) => { const q = P(p); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('') + 'Z';
  const R = rings(), sp = R.sp.map(poly => poly.map(path).join('')).join('');
  const nb = R.nb.flatMap(st => st.filter(poly => near(poly[0]))).map(poly => poly.map(path).join('')).join('');
  const sw = W >= 600 ? 1 : .8;
  const lbl = ([t, la, lo, cls]) => { const q = P([la, lo]); return `<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" text-anchor="middle" class="${cls}">${esc(t)}</text>`; };
  const rts = routes.map(r => { const d = routePath(r, P, 160), dash = r.pave === 'terra' ? 'stroke-dasharray="1 5"' : r.pave === 'misto' ? 'stroke-dasharray="7 4"' : ''; return `<path d="${d}" fill="none" stroke="var(--casing)" stroke-width="${6 * sw}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${routeColor(r)}" stroke-width="${3.4 * sw}" stroke-linecap="round" stroke-linejoin="round" ${dash}/>`; }).join('');
  const monRects = mons ? MONUMENTS.map(p => { const q = P([p.lat, p.lon]); return `<rect x="${(q[0] - 5).toFixed(1)}" y="${(q[1] - 5).toFixed(1)}" width="10" height="10" rx="2" fill="var(--c-monumento)" stroke="var(--casing)" stroke-width="2" ${WIP.has(p.id) ? 'opacity=".55"' : ''}/>`; }).join('') : '';
  // towns: a dot, and the name on the first side (right, left, above, below) that is free and inside the frame
  const towns = [...cities, ...(capital ? [['São Paulo', -23.55, -46.63]] : [])].map(([name, la, lo]) => ({ name, q: P([la, lo]) }));
  const fs = 14, boxes = towns.map(({ q }) => ({ x0: q[0] - 6, y0: q[1] - 6, x1: q[0] + 6, y1: q[1] + 6 }));
  const free = b => b.x0 >= 2 && b.x1 <= W - 2 && b.y0 >= 2 && b.y1 <= H - 2 && !boxes.some(o => b.x0 < o.x1 && o.x0 < b.x1 && b.y0 < o.y1 && o.y0 < b.y1);

    const o = opts.find(c => free(c[3]));

  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><rect width="${W}" height="${H}" fill="var(--sea)"/><path d="${nb}" fill="var(--land-2)" stroke="var(--sp-edge)" stroke-width=".8" stroke-opacity=".4" fill-rule="evenodd"/><path d="${sp}" fill="var(--land)" stroke="var(--sp-edge)" stroke-width="1.8" fill-rule="evenodd"/>${labels.map(lbl).join('')}${rts}${monRects}${townSvg}</svg>`;
}

let BRL = null;
function brPinHtml(p) {

function buildBrasil() {

    html: st.uf === 'SP' ? `<div class="map-label br-sp"><b>São Paulo</b><small>${ROUTES.length} rotas, toque para voltar</small></div>` : `<div class="map-label br-uf">${st.uf}</div>` }) })));
  const RLB = {};

    const opts = { pane: 'routes', interactive: false, lineCap: 'round', lineJoin: 'round' };
    const g = { shadow: L.polyline(r.ll, opts), casing: L.polyline(r.ll, opts), line: L.polyline(r.ll, opts), hit: L.polyline(r.ll, { pane: 'routes', weight: 22, opacity: 0, interactive: true, bubblingMouseEvents: false }) };

  BRL = { states, roads, labels, RLB, MKB, layers: [...Object.values(states), roads, routes, labels] };
}
function styleBrasil() {
  const c = n => cssVar(n), sel = S.brUf;
  Object.entries(BRL.states).forEach(([uf, poly]) => {
    if (uf === 'SP') { poly.setStyle({ color: c('--marca-verde'), weight: 1.5, opacity: 1, fillColor: c('--marca-verde'), fillOpacity: .94 }); return; }
    const on = !sel || uf === sel;
    poly.setStyle({ color: uf === sel ? c('--map-ink') : c('--sp-edge'), weight: uf === sel ? 2 : .8, opacity: uf === sel ? 1 : .8, fillColor: on ? c('--land') : c('--land-2'), fillOpacity: 1 });

  BR_ROUTES.forEach(r => {
    const g = BRL.RLB[r.id], on = (!focus || focus === r.id) && (!sel || r.uf === sel), big = focus === r.id;
    g.shadow.setStyle({ color: sh, weight: big ? 14 : 9, opacity: on ? 1 : .2 });

}
function renderBrPoint(p) {
  const kind = p.num ? `Monumento nº ${p.num} da Rota Biker` : CATS[p.cat].short;
  return `
    <div class="detail-top"><button class="icon-btn" data-act="br-back" aria-label="Voltar ao estado">${ic('i-back')}</button>
      <div class="detail-actions"><button class="icon-btn" data-act="sharebrpt" data-id="${p.id}" aria-label="Copiar localização">${ic('i-link')}</button></div></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="pict lg" style="--c:${catColor(p.cat)}">${ic(CATS[p.cat].icon)}</span>
      <span style="font-weight:700;color:var(--ink-2)">${esc(kind)}</span>${p.wip ? '<span class="status analise">Em construção</span>' : ''}</div>
    <h2 class="d-title" style="margin-top:10px">${esc(p.name)}</h2>
    <p class="d-sub">${esc(p.city)}, ${esc(BR_UF[p.uf].nome)}</p>
    <p class="prose" style="margin-top:12px">${esc(p.desc)}</p>
    ${p.aval ? avalBlock(p.aval) : ''}
    <div class="cta-row">
      <a class="btn" href="${gpointUrl(p.lat, p.lon)}" target="_blank" rel="noopener">${ic('i-nav')}Google Maps</a>
      <a class="btn" href="${wazeUrl(p.lat, p.lon)}" target="_blank" rel="noopener">${ic('i-nav')}Waze</a>
    </div>
    ${p.prec === 'cidade' ? `<p class="note">${ic('i-info')}<span>Localização aproximada, no centro da cidade.${p.num ? ' Confira o endereço no site da Rota Biker antes de ir.' : ''}</span></p>` : ''}
    ${p.num ? `<p class="note">${ic('i-checkpoint')}<span>O carimbo deste monumento é o do passaporte físico da Rota Biker. O Checkpoint do app vale só em São Paulo nesta versão.</span></p>` : ''}
    <div class="src">${srcLinks(p.src)}</div>`;
}

/* ------------------------------------------------------------------ theme reactivity + boot */
function onTheme() { styleBase(); refreshPins(); renderSheet(); if ($('#pages .page')) openPage(S.tab); $('#pitch').innerHTML = pitchHtml(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function openFromHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'passaporte') openPage('checkpoint'); // links antigos, de antes da troca de nome
  else if (PAGES.includes(h)) openPage(h);
  else if (h.startsWith('rota-') && R_BY[h.slice(5)]) openRoute(h.slice(5));
  else if (h === 'mapa') setTab('mapa');
  else if (h === 'brasil') enterBrasil();
  else if (h.startsWith('brasil-') && BR_UF[h.slice(7).toUpperCase()]) enterBrasil(h.slice(7).toUpperCase());
  else openPage('inicio'); // o app abre no painel do motociclista
}
window.addEventListener('hashchange', openFromHash);
function boot() {
  renderChips(); styleBase(); syncSuggestionMarkers(); refreshPins(); updateMe(); updateStampCount();
  setSheet('peek'); renderSheet();
  $('#pitch').innerHTML = pitchHtml();
  map.fitBounds(SP_BOUNDS, { paddingTopLeft: [12, padTop(116)], paddingBottomRight: [12, padBottom('peek', 8)], animate: false });
  zoomRules();
  openFromHash();
  setTimeout(() => map.invalidateSize(), 50);
}
boot();
})();

</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
