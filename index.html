// static drawings of the same basemap: the whole state on the pitch, one region per experience
let RINGS = null;
const rings = () => RINGS || (RINGS = { sp: BASE.sp.map(poly => poly.map(decode)), nb: BASE.nb.map(st => st.p.map(poly => poly.map(decode))) });
function mapSvg({ W, H, bounds, routes, labels = [], cities = [], mons = false, capital = false, aria }) {
  let [[minLa, minLo], [maxLa, maxLo]] = bounds;
  const k = Math.cos((minLa + maxLa) / 2 * Math.PI / 180), bw = (maxLo - minLo) * k, bh = maxLa - minLa;
  // grow the box to the frame so the land fills it, instead of letterboxing with sea
  if (bw / bh > W / H) { const add = (bw * H / W - bh) / 2; minLa -= add; maxLa += add; } else { const add = (bh * W / H - bw) / 2 / k; minLo -= add; maxLo += add; }
  const s = W / ((maxLo - minLo) * k), P = p => [(p[1] - minLo) * k * s, (maxLa - p[0]) * s];
  const near = ring => ring.some(p => p[1] > minLo - 1 && p[1] < maxLo + 1 && p[0] > minLa - 1 && p[0] < maxLa + 1);
  const path = pts => pts.map((p, i) => { const q = P(p); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('') + 'Z';
  const R = rings(), sp = R.sp.map(poly => poly.map(path).join('')).join('');
  const nb = R.nb.flatMap(st => st.filter(poly => near(poly[0]))).map(poly => poly.map(path).join('')).join('');
  const sw = W >= 600 ? 1 : .8;
  const lbl = ([t, la, lo, cls]) => { const q = P([la, lo]); return `<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" text-anchor="middle" class="${cls}">${esc(t)}</text>`; };
  const rts = routes.map(r => { const d = routePath(r, P, 160), dash = r.pave === 'terra' ? 'stroke-dasharray="1 5"' : r.pave === 'misto' ? 'stroke-dasharray="7 4"' : ''; return `<path d="${d}" fill="none" stroke="var(--casing)" stroke-width="${6 * sw}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${routeColor(r)}" stroke-width="${3.4 * sw}" stroke-linecap="round" stroke-linejoin="round" ${dash}/>`; }).join('');
  const monRects = mons ? MONUMENTS.map(p => { const q = P([p.lat, p.lon]); return `<rect x="${(q[0] - 5).toFixed(1)}" y="${(q[1] - 5).toFixed(1)}" width="10" height="10" rx="2" fill="var(--c-monumento)" stroke="var(--casing)" stroke-width="2" ${WIP.has(p.id) ? 'opacity=".55"' : ''}/>`; }).join('') : '';
  // towns: a dot, and the name on the first side (right, left, above, below) that is free and inside the frame
  const towns = [...cities, ...(capital ? [['São Paulo', -23.55, -46.63]] : [])].map(([name, la, lo]) => ({ name, q: P([la, lo]) }));
  const fs = 14, boxes = towns.map(({ q }) => ({ x0: q[0] - 6, y0: q[1] - 6, x1: q[0] + 6, y1: q[1] + 6 }));
  const free = b => b.x0 >= 2 && b.x1 <= W - 2 && b.y0 >= 2 && b.y1 <= H - 2 && !boxes.some(o => b.x0 < o.x1 && o.x0 < b.x1 && b.y0 < o.y1 && o.y0 < b.y1);
  const townSvg = towns.map(({ name, q }) => {
    const w = name.length * fs * .55, [x, y] = q;
    const opts = [[x + 9, y + 5, 'start', { x0: x + 8, y0: y - 8, x1: x + 9 + w, y1: y + 7 }], [x - 9, y + 5, 'end', { x0: x - 9 - w, y0: y - 8, x1: x - 8, y1: y + 7 }],
      [x, y - 10, 'middle', { x0: x - w / 2, y0: y - 23, x1: x + w / 2, y1: y - 7 }], [x, y + 21, 'middle', { x0: x - w / 2, y0: y + 8, x1: x + w / 2, y1: y + 24 }]];
    const o = opts.find(c => free(c[3]));
    if (o) boxes.push(o[3]);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--ink)" stroke="var(--casing)" stroke-width="2"/>${o ? `<text x="${o[0].toFixed(1)}" y="${o[1].toFixed(1)}" text-anchor="${o[2]}" class="hm-city">${esc(name)}</text>` : ''}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><rect width="${W}" height="${H}" fill="var(--sea)"/><path d="${nb}" fill="var(--land-2)" stroke="var(--sp-edge)" stroke-width=".8" stroke-opacity=".4" fill-rule="evenodd"/><path d="${sp}" fill="var(--land)" stroke="var(--sp-edge)" stroke-width="1.8" fill-rule="evenodd"/>${labels.map(lbl).join('')}${rts}${monRects}${townSvg}</svg>`;
}
function heroMap() {
  const b = SP_BOUNDS;
  return mapSvg({
    W: 640, H: 420, routes: ROUTES, mons: true, capital: true,
    bounds: [[b.getSouth() - .2, b.getWest() - .2], [b.getNorth() + .2, b.getEast() + .2]],
    labels: [['Oeste Paulista', -21.7, -50.75, 'hm-reg'], ['Vale do Ribeira', -24.88, -48.05, 'hm-reg'], ['Serra da Mantiqueira', -22.42, -45.75, 'hm-reg'], ['Litoral Norte', -24.05, -45.2, 'hm-reg'], ['Oceano Atlântico', -25.15, -45.9, 'hm-sea'], ['Minas Gerais', -20.25, -46.0, 'hm-state'], ['Paraná', -24.95, -51.2, 'hm-state']],
    aria: `Mapa do estado de São Paulo com as ${ROUTES.length} rotas do protótipo`,
  });
}
function pitchHtml() {
  const km = Math.round(ROUTES.reduce((a, r) => a + r.km, 0));
  const bench = (BENCH || []).map(b => `<tr><td>${esc(b.app)}</td><td>${esc(b.forte)}</td><td>${esc(b.entra)}</td></tr>`).join('');
  const src = [
    ['Agência SP: Guia de Mototurismo', 'https://www.agenciasp.sp.gov.br/sp-lanca-guia-de-mototurismo-com-foco-nos-viajantes-de-moto/'],
    ['Brasilturis: rotas de mototurismo de 2024', 'https://brasilturis.com.br/2024/12/03/sao-paulo-apresenta-rota-de-mototurismo-durante-o-8o-expo-forum-visite-sp'],
    ['Rota Biker: lista de monumentos', 'https://monumentobikers.com.br/'],
    ['Alesp: PL 331/2026', 'https://www.al.sp.gov.br/spl/2026/04/Propositura/1000685806_1000855553_Propositura.pdf'],
    ['Vrum: frota de motos em SP', 'https://www.vrum.com.br/noticias/2026/01/7329030-isencao-de-ipva-para-motos-em-sp-beneficia-quase-80-da-frota-em-2026.html'],
    ['Abraciclo: vendas de 2025', 'https://jornaldebrasilia.com.br/noticias/economia/abraciclo-producao-de-motos-cresce-13-em-2025-maior-volume-desde-2011-vendas-batem-recorde/'],
    ['Diário do Turismo: turismo paulista em 2026', 'https://diariodoturismo.com.br/turismo-de-sp-pode-alcancar-r-369-bilhoes-em-2026-aponta-estudo/'],
    ['Conturesp: estâncias e MITs', 'https://plataforma.turismo.sp.gov.br/capa-turismo/conturesp/files/plano-de-acao.pdf'],
    ['Motor Show: Infosiga 2025', 'https://motorshow.com.br/estado-de-sp-tem-recorde-de-mortes-de-motociclistas-em-2025'],
    ['ARTESP: ouvidoria', 'https://www.artesp.sp.gov.br/artesp/canais-de-comunicacao/ouvidoria'],
    ['Estrada Real: passaporte', 'https://institutoestradareal.com.br/en/passaporte/'],
    ['Mercado & Eventos: Visit Pará', 'https://www.mercadoeeventos.com.br/?p=654482'],
    ['Calimoto: plano Premium', 'https://support.calimoto.com/hc/en-us/articles/9036581115164-calimoto-Premium-Product-Overview'],
    ['REVER: perguntas frequentes', 'https://rever.co/faqs'],
  ];
  return `<div class="pitch-in">
  <header class="p-hero">
    <div class="p-title">${emblema()}<div><h1>Rota São Paulo</h1><p class="p-tag">O estado inteiro, curva a curva.</p></div></div>
    <p class="p-lede">Uma proposta de app de mototurismo para o estado que junta o mapa com geolocalização do RotaBiker, o cadastro de novos destinos com curadoria do Box Experience e o Guia de Mototurismo da Setur-SP. O motociclista escolhe a rota pelo tipo de estrada, pela distância e pelas curvas, faz check-in nos monumentos e viaja com protocolos de segurança.</p>
  </header>
  <div class="p-mapgrid">
    <figure class="p-map">${heroMap()}<figcaption><span><i style="background:var(--curv-hi)"></i>Muitas curvas</span><span><i style="background:var(--curv-mid)"></i>Moderadas</span><span><i style="background:var(--curv-lo)"></i>Poucas curvas</span><span><i style="background:var(--c-monumento);width:9px;height:9px;border-radius:3px"></i>Monumentos Rota Biker</span></figcaption></figure>
    <div class="placa" role="img" aria-label="Rota São Paulo em números: ${ROUTES.length} rotas, ${fmtInt(km)} km, ${POINTS.length} pontos e ${MONUMENTS.length} monumentos">
      <div class="placa-in"><div class="ph"><span class="shield">SP</span>Rota São Paulo</div>
        <div class="placa-row"><span>Rotas com traçado real</span><b>${ROUTES.length}</b></div>
        <div class="placa-row"><span>Quilômetros de estrada</span><b>${fmtInt(km)}</b></div>
        <div class="placa-row"><span>Pontos de interesse</span><b>${POINTS.length}</b></div>
        <div class="placa-row"><span>Monumentos Rota Biker</span><b>${MONUMENTS.length}</b></div></div></div>
  </div>
  <section class="p-sec"><h2>Três projetos num app só</h2>
    <div class="fusion">
      <div class="fus"><span class="pict lg" style="--c:var(--c-mirante)">${ic('i-locate')}</span><div><span class="from">Do RotaBiker</span><strong>Geolocalização</strong><p>Mapa, posição em tempo real, distância até cada ponto e check-in pelo GPS nos monumentos.</p></div></div>
      <div class="fus"><span class="pict lg" style="--c:var(--c-gastronomia)">${ic('i-comunidade')}</span><div><span class="from">Do Box Experience</span><strong>Novos destinos</strong><p>Cadastro de pontos e roteiros com curadoria, no formato de viagens com apoio e paradas escolhidas.</p></div></div>
      <div class="fus"><span class="pict lg" style="--c:var(--mata)">${ic('i-shield')}</span><div><span class="from">Da Setur-SP</span><strong>Guia oficial</strong><p>As rotas e os 118 atrativos do Guia de Mototurismo viram uma base viva, atualizada pela comunidade.</p></div></div>
    </div>
    <div class="fus-out">${LOGO}<p><strong>Rota São Paulo</strong>Rotas por tipo de estrada, distância e curvas, checkpoints com carimbo e central de segurança, no iPhone e no Android.</p></div>
  </section>
  <section class="p-sec"><h2>O que já existe em São Paulo</h2>
    <p>A Setur-SP lançou em setembro de 2025 o Guia de Mototurismo, com 118 atrativos e serviços em 57 cidades, e já tinha apresentado cinco rotas de mototurismo em 2024. É um guia digital, não um aplicativo, e o estado não tem hoje um app oficial de turismo ativo.</p>
    <p>A Rota Biker lista 14 monumentos em São Paulo, e o PL 331/2026 na Alesp quer reconhecê-la como rota temática do estado. São 5,7 milhões de motos em SP, e as vendas no país bateram recorde em 2025, com 2,19 milhões de unidades. O turismo paulista deve movimentar R$ 369 bilhões em 2026.</p>
    <p>Não encontramos nenhum app brasileiro que junte rotas curadas, pontos colaborativos e checkpoints com carimbo. Os precedentes públicos mais próximos são o passaporte digital da Estrada Real, com mais de 178 mil passaportes desde 2014, e o Visit Pará, lançado em 2025 com mapas de calor e painéis para o governo.</p>
  </section>
  <section class="p-sec"><h2>O que o Estado ganha</h2>
    <div class="gain">
      <div><span class="pict lg" style="--c:var(--c-natureza)">${ic('i-map')}</span><span><strong>Turismo no interior</strong><p>Checkpoints e roteiros levam o motociclista às 78 estâncias e aos 206 municípios de interesse turístico.</p></span></div>
      <div><span class="pict lg" style="--c:var(--c-mirante)">${ic('i-gauge')}</span><span><strong>Dados para decidir</strong><p>Fluxo anônimo por rota e região para priorizar sinalização, mirantes, áreas de descanso e campanhas.</p></span></div>
      <div><span class="pict lg" style="--c:var(--alerta)">${ic('i-shield')}</span><span><strong>Segurança viária</strong><p>O estado teve recorde de 1.329 motociclistas mortos no 1º semestre de 2025. O app leva protocolos por rota, checklist de saída e SOS com posição.</p></span></div>
      <div><span class="pict lg" style="--c:var(--c-comunidade)">${ic('i-users')}</span><span><strong>Guia sempre atual</strong><p>A comunidade sugere, a Setur e os municípios aprovam. O guia deixa de envelhecer em PDF.</p></span></div>
    </div>
  </section>
  ${bench ? `<section class="p-sec"><h2>O que aprendemos com os apps de moto</h2><div class="bench-wrap"><table class="bench"><thead><tr><th>App</th><th>Ponto forte</th><th>O que entra no Rota São Paulo</th></tr></thead><tbody>${bench}</tbody></table></div></section>` : ''}
  <section class="p-sec"><h2>Como implantar</h2>
    <div class="road">
      <div><h3><span class="pict" style="--c:var(--mata)">${ic('i-flag')}</span>Primeira versão</h3><ul><li>App para iPhone e Android, com mapa e GPS</li><li>Rotas do Guia SP com filtros por estrada, distância e curvas</li><li>Cadastro de pontos com curadoria</li><li>Checkpoints e check-in nos monumentos</li><li>Central de segurança, checklist e SOS</li></ul></div>
      <div><h3><span class="pict" style="--c:var(--sol)">${ic('i-route')}</span>Segunda fase</h3><ul><li>Navegação curva a curva e mapas offline</li><li>Detecção de queda com alerta automático ao contato</li><li>Alertas de interdição, obras e clima com DER, ARTESP e Defesa Civil</li><li>Selo Moto Amigo para parceiros</li><li>Painel do Estado com dados anônimos e experiências com agências credenciadas</li></ul></div>
    </div>
  </section>
  <section class="p-sec"><h2>Como testar o protótipo</h2>
    <ol class="howto">
      <li><span>Toque em <b>Rotas</b> e use as categorias ou os filtros de tipo de estrada, distância e curvas.</span></li>
      <li><span>Abra uma rota e toque em <b>Iniciar viagem</b>: o checklist aparece e a moto percorre o traçado, com check-in automático nas paradas.</span></li>
      <li><span>Toque em <b>Sugerir</b> e cadastre um ponto. Depois, em <b>Comunidade</b>, ative o modo curadoria e aprove.</span></li>
      <li><span>Toque em <b>SOS</b> para ver a central de segurança. No mapa, toque em <b>Você está em</b> para mudar a posição simulada.</span></li>
    </ol>
  </section>
  <footer class="p-foot">
    <span>Protótipo conceitual para apresentação. Não é um produto oficial do Governo do Estado de São Paulo. Os traçados foram calculados sobre o OpenStreetMap e a contagem de curvas é nossa. Os pontos marcados como aproximados ainda precisam de validação.</span>
    <ul>${src.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul>
  </footer>
</div>`;
}

/* ------------------------------------------------------------------ theme reactivity + boot */
function onTheme() { styleBase(); refreshPins(); renderSheet(); if ($('#pages .page')) openPage(S.tab); $('#pitch').innerHTML = pitchHtml(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function openFromHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'passaporte') openPage('checkpoint'); // links antigos, de antes da troca de nome
  else if (PAGES.includes(h)) openPage(h);
  else if (h.startsWith('rota-') && R_BY[h.slice(5)]) openRoute(h.slice(5));
  else if (h === 'mapa') setTab('mapa');
  else openPage('inicio'); // o app abre no painel do motociclista
}
window.addEventListener('hashchange', openFromHash);
function boot() {
  renderChips(); styleBase(); syncSuggestionMarkers(); refreshPins(); updateMe(); updateStampCount();
  setSheet('peek'); renderSheet();
  $('#pitch').innerHTML = pitchHtml();
  map.fitBounds(SP_BOUNDS, { paddingTopLeft: [12, window.innerWidth >= 980 ? 152 : 116], paddingBottomRight: [12, sheetPx('peek') + NAV_H + 8], animate: false });
  zoomRules();
  openFromHash();
  setTimeout(() => map.invalidateSize(), 50);
}
boot();
})();

</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
